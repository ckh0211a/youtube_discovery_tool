<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - YouTube Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center" id="loadingScreen">
    <div class="text-center">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
        <p class="text-gray-400">관리자 권한 확인 중...</p>
    </div>

    <!-- Main Content (Hidden by default) -->
    <div id="adminContent" class="hidden w-full max-w-5xl mx-auto px-4 py-8">
        <!-- Navbar -->
        <nav class="glass-panel rounded-2xl px-6 py-4 flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <i class="fab fa-youtube text-red-500 text-3xl"></i>
                <span class="text-xl font-bold tracking-tight text-white">Admin<span class="text-blue-500">Dash</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-sm font-medium text-gray-300 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                    <i class="fas fa-user-shield text-blue-400"></i>
                    <span id="adminName">관리자 계정</span>
                </div>
                <button onclick="window.close()" class="text-gray-400 hover:text-red-400 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </nav>

        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">시스템 컨트롤 패널</h1>
            <p class="text-gray-400">서버 상태 관리 및 유지보수를 위한 전용 대시보드입니다.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <!-- 1. Cookie Upload Panel -->
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-white mb-1"><i class="fas fa-cookie-bite text-orange-400 mr-2"></i>쿠키(Cookies) 업데이트</h2>
                        <p class="text-sm text-gray-400">유튜브 IP 차단을 우회하기 위해 최신 cookies.txt 파일을 업로드하세요.</p>
                    </div>
                </div>
                
                <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-4 mb-4">
                    <input type="file" id="cookieFileInput" accept=".txt" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-500/10 file:text-blue-400 hover:file:bg-blue-500/20 cursor-pointer">
                </div>
                <button onclick="uploadCookies()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-upload"></i> 서버에 쿠키 적용하기
                </button>
                <p id="cookieStatusMsg" class="text-xs text-center mt-3 hidden"></p>
            </div>

            <!-- 2. System Cache Panel -->
            <div class="glass-panel rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-white mb-1"><i class="fas fa-broom text-emerald-400 mr-2"></i>서버 캐시 초기화</h2>
                        <p class="text-sm text-gray-400">대본이나 데이터가 꼬였을 때 강제로 서버 데이터를 비웁니다.</p>
                    </div>
                </div>
                
                <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-4 mb-4 text-sm text-gray-300">
                    <ul class="list-disc pl-5 space-y-1">
                        <li>유튜브 메타데이터 임시 저장소 비우기</li>
                        <li>대본 추출 오류 기록 초기화</li>
                        <li>(서버 재부팅 없이 즉시 적용)</li>
                    </ul>
                </div>
                <button onclick="clearCache()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-trash-alt"></i> 캐시 초기화 실행
                </button>
                <p id="cacheStatusMsg" class="text-xs text-center mt-3 hidden"></p>
            </div>
            
        </div>
        
    </div>

    <script>
        const SUPABASE_URL = 'https://lpsqagujuhblpthvrqdn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_TyGy0J574dfCo3JFJVDeSg_KnD5TRNr';
        const supabaseLib = window.supabase || globalThis.supabase;
        const supabaseClient = supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Get Backend URL to support local testing and Render production
        const getBackendUrl = () => {
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            return isLocal ? 'http://127.0.0.1:5001' : 'https://youtube-discovery-tool-1.onrender.com';
        };

        async function verifyAdmin() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error || !session) {
                    alert('로그인이 필요합니다.');
                    window.location.href = '/';
                    return;
                }

                if (session.user.email !== 'imomsschool@gmail.com') {
                    alert('접근 권한이 없습니다. 관리자 계정으로 로그인해주세요.');
                    window.location.href = '/';
                    return;
                }

                // Authorized
                document.getElementById('loadingScreen').classList.remove('min-h-screen', 'flex');
                document.getElementById('loadingScreen').style.display = 'none';
                
                const content = document.getElementById('adminContent');
                content.classList.remove('hidden');
                document.getElementById('adminName').innerText = session.user.email;
                
            } catch (err) {
                console.error('Auth Error:', err);
                alert('인증 중 오류가 발생했습니다.');
                window.location.href = '/';
            }
        }

        async function uploadCookies() {
            const fileInput = document.getElementById('cookieFileInput');
            const file = fileInput.files[0];
            const msgEl = document.getElementById('cookieStatusMsg');
            
            if (!file) {
                msgEl.innerText = "쿠키 파일을 먼저 선택해주세요.";
                msgEl.className = "text-xs text-center mt-3 text-red-400 block";
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            msgEl.innerText = "업로드 중...";
            msgEl.className = "text-xs text-center mt-3 text-blue-400 block";

            try {
                // We send a secret header to bypass the Flask session check for APIs, 
                // but wait, server.py requires Flask session or we can implement a secret API key.
                // It's better to pass the Supabase token in the header and verify it in server.py,
                // OR we can rely on the fact that if they reached here, the frontend verified them.
                // Let's pass the supabase access token.
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                const res = await fetch(`${getBackendUrl()}/api/admin/upload-cookie`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${session.access_token}` },
                    body: formData
                });
                
                const result = await res.json();
                if (result.status === 'success') {
                    msgEl.innerHTML = `<i class="fas fa-check-circle"></i> 쿠키 파일이 성공적으로 적용되었습니다!`;
                    msgEl.className = "text-xs text-center mt-3 text-emerald-400 block";
                } else {
                    msgEl.innerText = `업로드 실패: ${result.message}`;
                    msgEl.className = "text-xs text-center mt-3 text-red-400 block";
                }
            } catch (error) {
                msgEl.innerText = `서버 통신 오류: ${error.message}`;
                msgEl.className = "text-xs text-center mt-3 text-red-400 block";
            }
        }

        async function clearCache() {
            const msgEl = document.getElementById('cacheStatusMsg');
            msgEl.innerText = "초기화 중...";
            msgEl.className = "text-xs text-center mt-3 text-blue-400 block";

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const res = await fetch(`${getBackendUrl()}/api/admin/clear-cache`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${session.access_token}` }
                });
                
                const result = await res.json();
                if (result.status === 'success') {
                    msgEl.innerHTML = `<i class="fas fa-check-circle"></i> 서버 캐시가 정리되었습니다!`;
                    msgEl.className = "text-xs text-center mt-3 text-emerald-400 block";
                } else {
                    msgEl.innerText = `초기화 실패: ${result.message}`;
                    msgEl.className = "text-xs text-center mt-3 text-red-400 block";
                }
            } catch (error) {
                msgEl.innerText = `서버 통신 오류: ${error.message}`;
                msgEl.className = "text-xs text-center mt-3 text-red-400 block";
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', verifyAdmin);
    </script>
</body>
</html>
